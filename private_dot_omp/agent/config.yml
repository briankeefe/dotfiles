symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 3
modelRoles:
  smol: openai-codex/gpt-6-luna:minimal
  advisor: openai-codex/gpt-6.1-sol:medium
  default: openai-codex/gpt-6.1-sol:medium
disabledProviders:
  - anthropic
colorBlindMode: true
tui:
  textSizing: true
  hyperlinks: always
  titleSpinner: braille
  titleState: true
  tight: false
  mouse: false
  codexResetFireworks: false
statusLine:
  separator: powerline
  sessionAccent: true
  showHookStatus: false
  preset: custom
  compactThinkingLevel: false
  transparent: false
  contextLine: embedded
  leftSegments:
    - vim
    - model
    - mode
    - git
    - pr
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  llmMode: smol
  autoRecall: true
  autoRetain: true
startup:
  quiet: false
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate
hideThinkingBlock: false
task:
  agentModelOverrides:
    task: openai-codex/gpt-6.1-sol
    sonic: openai-codex/gpt-6-luna
dev:
  autoqaConsent: granted
read:
  toolResultPreview: true
composer:
  shape: field
  tokenRate: false
browser:
  relay: true
  headless: false
defaultThinkingLevel: medium
proseOnlyThinking: true
display:
  shimmer: classic
  pinnedAgents: collapsed
completion:
  notify: "off"
ask:
  notify: "off"
codexResets:
  autoRedeem: "yes"
compaction:
  thresholdTokens: 272000
update:
  auto: false
symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 2
modelRoles:
  smol: openai-codex/gpt-6-luna:minimal
  advisor: openai-codex/gpt-6.1-sol:medium
  default: openai-codex/gpt-6-astra:medium
disabledProviders:
  - anthropic
colorBlindMode: true
tui:
  textSizing: true
  hyperlinks: always
statusLine:
  separator: powerline
  sessionAccent: true
  showHookStatus: false
  preset: compact
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  llmMode: smol
  autoRecall: true
  autoRetain: true
startup:
  quiet: false
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate
hideThinkingBlock: false
task:
  agentModelOverrides:
    task: openai-codex/gpt-6.1-sol
    sonic: openai-codex/gpt-6-luna
dev:
  autoqaConsent: granted
read:
  toolResultPreview: true
composer:
  shape: field
browser:
  relay: true
defaultThinkingLevel: medium
proseOnlyThinking: true
# Herdr's Idle/Blocked state notifications own the sounds; avoid duplicate OMP alerts.
completion:
  notify: "off"
ask:
  notify: "off"
compaction:
  thresholdTokens: 272000

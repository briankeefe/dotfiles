general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    outer_color = rgba(7aa2f7ee)
    inner_color = rgba(1a1b26dd)
    font_color = rgb(c0caf5)
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    fail_text = <i>$FAIL</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(c0caf5)
    font_size = 72
    font_family = monospace
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(a9b1d6)
    font_size = 18
    font_family = monospace
    position = 0, 25
    halign = center
    valign = center
}
